name: Legacy core smoke tests

on:
  push:
    paths: ['src/**', 'tests/**', 'shared/**', 'editor/**', 'runtime/**', 'docs/examples/**', 'docs/schemas/**', 'exemploproject/**', 'tools/zig/**', 'tools/install_zig.sh', 'tools/test_install_zig.sh', 'tools/prepare_legacy_deps.sh', 'tools/test_prepare_legacy_deps.sh', 'build.zig', 'build.zig.zon', 'tools/prepare_legacy_deps.py', 'tools/test_prepare_legacy_deps.py', 'tools/zig-requirements.txt', '.github/workflows/legacy-core.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'shared/**', 'editor/**', 'runtime/**', 'docs/examples/**', 'docs/schemas/**', 'exemploproject/**', 'tools/zig/**', 'tools/install_zig.sh', 'tools/test_install_zig.sh', 'tools/prepare_legacy_deps.sh', 'tools/test_prepare_legacy_deps.sh', 'build.zig', 'build.zig.zon', 'tools/prepare_legacy_deps.py', 'tools/test_prepare_legacy_deps.py', 'tools/zig-requirements.txt', '.github/workflows/legacy-core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install exact Zig toolchain without Python
        run: |
          sh tools/test_install_zig.sh
          sh tools/install_zig.sh "$RUNNER_TEMP/corex-zig"
          echo "ZIG_EXE=$RUNNER_TEMP/corex-zig/ziglang/zig" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Test Zig/shell legacy dependency preparation
        run: sh tools/test_prepare_legacy_deps.sh "$ZIG_EXE"
      - name: Prepare legacy packages without Python
        run: sh tools/prepare_legacy_deps.sh --zig "$ZIG_EXE"
      - name: Keep Python preparer regression and shadow verification
        run: |
          python tools/test_prepare_legacy_deps.py
          python tools/prepare_legacy_deps.py --zig "$ZIG_EXE"
      - run: |
          "$ZIG_EXE" fmt --check build.zig src/legacy_tests.zig src/zigway_input_tests.zig src/jobs/job_system.zig src/events/event.zig src/main.zig src/graphics/renderer/render.zig tests/events/test_basics.zig tests/integration/engine_pipeline.zig
      - run: |
          "$ZIG_EXE" build --summary all
      - run: |
          "$ZIG_EXE" build test --summary all
      - run: |
          "$ZIG_EXE" build test -Doptimize=ReleaseSafe --summary all
      - name: Native Zig project validation (additional coverage)
        run: |
          "$ZIG_EXE" build validate -j2 --summary all
      - name: Cross-compile Windows (no native execution)
        run: |
          "$ZIG_EXE" build check -Dtarget=x86_64-windows-gnu -j2 --summary all

# This is a legacy null-backend smoke suite, not graphical or gameplay validation.
