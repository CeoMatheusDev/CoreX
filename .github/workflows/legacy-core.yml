name: Legacy core smoke tests

on:
  push:
    paths: ['src/**', 'tests/**', 'build.zig', 'build.zig.zon', 'tools/python/**', '.github/workflows/legacy-core.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'build.zig', 'build.zig.zon', 'tools/python/**', '.github/workflows/legacy-core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create isolated Python tool environment
        run: |
          python -m venv "$RUNNER_TEMP/corex-tools-venv"
          "$RUNNER_TEMP/corex-tools-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tools/python/requirements-zig.txt
          echo "$RUNNER_TEMP/corex-tools-venv/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: python tools/python/test_prepare_legacy_deps.py
      - run: python tools/python/prepare_legacy_deps.py
      - run: python -m ziglang fmt --check build.zig src/legacy_tests.zig src/zigway_input_tests.zig src/jobs/job_system.zig src/events/event.zig src/main.zig src/graphics/renderer/render.zig tests/events/test_basics.zig tests/integration/engine_pipeline.zig
      - run: python -m ziglang build --summary all
      - run: python -m ziglang build test --summary all
      - run: python -m ziglang build test -Doptimize=ReleaseSafe --summary all
      - name: Cross-compile Windows (no native execution)
        run: python -m ziglang build check -Dtarget=x86_64-windows-gnu -j2 --summary all

# This is a legacy null-backend smoke suite, not graphical or gameplay validation.
