name: Application contracts and bootstraps

on:
  push:
    paths: ['shared/**', 'editor/**', 'runtime/**', '.gitattributes', 'tools/**', 'docs/examples/**', 'docs/schemas/**', '.github/workflows/shared-contracts.yml']
  pull_request:
    paths: ['shared/**', 'editor/**', 'runtime/**', '.gitattributes', 'tools/**', 'docs/examples/**', 'docs/schemas/**', '.github/workflows/shared-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contracts:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact toolchain (wheel hashes verified)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/zig-requirements.txt
      - name: Verify compiler version
        run: python -c "import subprocess; v = subprocess.check_output(['python', '-m', 'ziglang', 'version'], text=True).strip(); assert v == '0.17.0', v"
      - name: Check approved fixtures
        run: python tools/check_contract_fixtures.py
      - name: Check formatting
        run: python -m ziglang fmt --check shared editor runtime
      - name: Test Zig and C23 contracts (Debug)
        working-directory: shared
        run: python ../tools/ci_capture.py python -m ziglang build test --summary all
      - name: Test Zig and C23 contracts (ReleaseSafe)
        working-directory: shared
        run: python ../tools/ci_capture.py python -m ziglang build test -Doptimize=ReleaseSafe --summary all
      - name: Check private C header with C++20, without RTTI/exceptions
        run: python tools/ci_capture.py c++ -std=c++20 -fno-rtti -fno-exceptions -Wall -Wextra -Werror -fsyntax-only -x c++ shared/graphics_abi.h shared/platform_ext/process_native.h
      - name: Build independent bootstraps (Debug)
        run: |
          cd editor && python ../tools/ci_capture.py python -m ziglang build --summary all
          cd ../runtime && python ../tools/ci_capture.py python -m ziglang build --summary all
      - name: Test application interaction models
        run: |
          cd editor && python ../tools/ci_capture.py python -m ziglang build test --summary all
          cd ../runtime && python ../tools/ci_capture.py python -m ziglang build test --summary all
      - name: Reject unsupported product targets
        run: python tools/ci_capture.py python tools/check_application_targets.py
      - name: Test real processes (Debug; validation only)
        run: python tools/ci_capture.py python tools/test_bootstrap.py
      - name: Build independent bootstraps (ReleaseSafe)
        run: |
          cd editor && python ../tools/ci_capture.py python -m ziglang build -Doptimize=ReleaseSafe --summary all
          cd ../runtime && python ../tools/ci_capture.py python -m ziglang build -Doptimize=ReleaseSafe --summary all
      - name: Test real processes (ReleaseSafe; validation only)
        run: python tools/ci_capture.py python tools/test_bootstrap.py
      - name: Cross-compile Windows contracts (not native execution)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: shared
        run: |
          python ../tools/ci_capture.py python -m ziglang build check -Dtarget=x86_64-windows-gnu -j2 --summary all
          cd ../editor && python ../tools/ci_capture.py python -m ziglang build check -Dtarget=x86_64-windows-gnu -j2 --summary all
          cd ../runtime && python ../tools/ci_capture.py python -m ziglang build check -Dtarget=x86_64-windows-gnu -j2 --summary all

# Validation bootstraps only; not a full graphical Editor/Runtime CI matrix. Native Windows needs a
# verified Zig 0.17.0 Windows distribution (P16); no wheel is published at the
# time of implementation. Cross-compilation must not be reported as native tests.

# Product scope: Windows/Linux only (ADR-003). No macOS job or artifact support.
